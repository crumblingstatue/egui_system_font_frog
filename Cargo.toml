[package]
name = "egui_system_font_frog"
version = "0.37.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>", "crumblingstatue"]
description = "Load system fonts on demand for characters the egui fonts lack (fork)"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/crumblingstatue/egui_system_font_frog"
categories = ["gui"]
keywords = ["egui", "gui", "fonts", "text"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[lib]


[dependencies]
epaint = { version = "0.37.0", default-features = false, features = ["color_fonts"] }
fontique = { version = "0.11.1", default-features = false, features = [
  "system",
  "fontconfig-dlopen", # Load libfontconfig at runtime, so builds don't need its headers
] }
log = "0.4.34"
poll-promise = { version = "0.3.0", default-features = false }
skrifa = { version = "0.44.0", default-features = false, features = [
  "std",
  "autohint_shaping",
] } # Can't update to 0.45+: `glifo` (via vello_cpu 0.2) pins skrifa 0.44, so bumping splits skrifa into two versions
sys-locale = "0.3.2"
unicode-script = "0.5.8"

[dev-dependencies]
egui = "0.37"
